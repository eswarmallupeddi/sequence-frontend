<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Sequence</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- LANDING PAGE -->
    <div id="landing-page" class="screen active">
        <div class="modal">
            <h1>SEQUENCE</h1>
            <p>Join the Game</p>
            <input type="text" id="username" placeholder="Enter your name" required>
            <select id="team-select">
                <option value="red">Red Team</option>
                <option value="blue">Blue Team</option>
            </select>
            <button id="join-btn">Enter Game</button>
        </div>
    </div>
    <!-- LOBBY PAGE -->
    <div id="lobby-page" class="screen">
        <div class="modal">
            <h2>Waiting for Players...</h2>
            <ul id="player-list" style="list-style: none; padding: 20px 0; font-size: 1.2rem;">
                <!-- Players will populate here -->
            </ul>
            <button id="start-game-btn">Start Game</button>
        </div>
    </div>
    <!-- GAME PAGE -->
    <div id="game-page" class="screen">
        <div class="header">
            <h2>Current Turn: <span id="turn-indicator">Waiting...</span></h2>
            <h3 id="player-info"></h3>
        </div>
        
        <div id="board"></div>
        
        <div class="hand-container">
            <h3>Your Hand: (Click a card, then click the board)</h3>
            <div id="hand"></div>
        </div>
    </div>

    <!-- Replace with your actual server URL -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
