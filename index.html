<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sequence Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- SCREEN 1: Choose a Name (image_82309f.png) -->
    <div id="name-screen" class="screen active">
        <div class="panel">
            <h1 class="cyan-text">Choose a name for yourself</h1>
            <input type="text" id="nickname" placeholder="Nickname">
            <button id="submit-name" class="pink-btn">Submit</button>
        </div>
    </div>

    <!-- SCREEN 2: Lobby & Settings (image_823134.png) -->
    <div id="lobby-screen" class="screen">
        <div class="panel wide">
            <h2 class="cyan-text">Share the link of this game with others!</h2>
            <div class="share-box">
                <input type="text" id="share-link" readonly>
                <button id="copy-btn">Copy</button>
            </div>

            <h2 class="cyan-text">Settings</h2>
            <div class="settings-grid">
                <!-- Sliders and Dropdowns go here -->
                <label>Time for a player to make a move (seconds)</label>
                <input type="range" min="15" max="120" value="60">
            </div>

            <h2 class="cyan-text">Team members</h2>
            <button class="outline-btn">Randomize Teams</button>
            <p class="subtitle">Set the team members in each area. You can drag and drop the players to change their teams!</p>
            
            <div class="teams-container">
                <div class="team-box blue-team" id="blue-dropzone"></div>
                <div class="team-box red-team" id="red-dropzone"></div>
                <div class="team-box green-team" id="green-dropzone"></div>
            </div>

            <button id="start-game-btn" class="pink-btn large">Start the Game</button>
        </div>
    </div>

    <!-- SCREEN 3: Game Board (image_822d15.jpg) -->
    <!-- SCREEN 3: Game Board -->
    <div id="game-screen" class="screen">
        <div class="game-layout">
            
            <!-- Left Side: The Board -->
            <div class="board-container">
                <div id="board"></div>
            </div>
            
            <!-- Right Side: Side Panel -->
            <div class="side-panel">
                <div class="turn-box">
                    <h2 id="turn-indicator">Waiting...</h2>
                </div>

                <div class="scoreboard">
                    <h3>Sequences (Goal: 2)</h3>
                    <div id="score-display">
                        <span style="color:#ff7675;">Red: <b id="score-red">0</b></span> | 
                        <span style="color:#3b82f6;">Blue: <b id="score-blue">0</b></span> | 
                        <span style="color:#b8e994; color:#333;">Green: <b id="score-green">0</b></span>
                    </div>
                </div>
                
                <div class="hand-container">
                    <h3>Your Hand</h3>
                    <div id="hand" class="cards-grid"></div>
                </div>

                <div class="discard-pile">
                    <h3>Deck & Discard</h3>
                    <div class="pile-layout">
                        <div class="deck-box">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/d/d4/Card_back_01.svg" class="card-img" style="width: 50px;">
                            <div><span id="cards-left">104</span> left</div>
                        </div>
                        <div id="last-discarded"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
